services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bca_dev}
      POSTGRES_DB: ${POSTGRES_DB:-bca_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bca}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
